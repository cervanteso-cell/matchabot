name: matchabot-android-apk

# Builds the Matcha bot Android APK on a GitHub runner: the branded fork is not an Expo
# project, so the upstream EAS workflow cannot be used. The APK is signed with the
# generated debug keystore, which is fine for direct installation.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the APK to (optional, e.g. matchabot-0.16.0)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: matchabot-android-apk
  cancel-in-progress: false

jobs:
  apk:
    name: Build the arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Android project
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://matchabot.fr
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build the release APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://matchabot.fr
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Collect and check the APK
        id: apk
        run: |
          set -euo pipefail
          src="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$src" || { echo "No APK was produced." >&2; exit 1; }
          version="$(node -p "require('./apps/mobile/app.json').expo.version")"
          code="$(node -p "require('./apps/mobile/app.json').expo.android.versionCode")"
          out="Matcha-bot-android-${version}-arm64.apk"
          cp "$src" "$out"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - name: Attach to the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: gh release upload "$TAG" "$APK" --clobber

      - name: Upload the artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchabot-android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: warn
